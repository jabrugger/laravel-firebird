name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        firebird: ['3', '4', '5']
        laravel: ['12', '13']
        stability: ['prefer-stable']
        include:
          # Lowest supported dependency versions, to check the declared constraints.
          - php: '8.3'
            firebird: '5'
            laravel: '12'
            stability: 'prefer-lowest'

    name: PHP ${{ matrix.php }} / Firebird ${{ matrix.firebird }} / Laravel ${{ matrix.laravel }}${{ matrix.stability == 'prefer-lowest' && ' (lowest)' || '' }}

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3050
      DB_DATABASE: /var/lib/firebird/data/database.fdb
      DB_USERNAME: sysdba
      DB_PASSWORD: masterkey

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_DATABASE: database.fdb
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_USE_LEGACY_AUTH: 'true'
        ports:
          - 3050:3050

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_firebird
          coverage: none

      - name: Verify pdo_firebird is loaded
        run: |
          php -m
          if ! php -m | grep -iq firebird; then
            echo "::error::pdo_firebird extension is not loaded"
            exit 1
          fi

      - name: Select Laravel 12 (Testbench 10)
        if: matrix.laravel == '12'
        run: composer require "orchestra/testbench:^10.3" --dev --no-update --no-interaction

      - name: Install dependencies
        run: |
          if [ "${{ matrix.stability }}" = "prefer-lowest" ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Show resolved Laravel version
        run: composer show laravel/framework | grep -E '^(name|versions)'

      - name: Wait for Firebird to be ready
        run: |
          for i in $(seq 1 30); do
            if php -r '
              try {
                  new PDO(
                      "firebird:dbname=".getenv("DB_HOST")."/".getenv("DB_PORT").":".getenv("DB_DATABASE").";charset=UTF8",
                      getenv("DB_USERNAME"), getenv("DB_PASSWORD")
                  );
                  exit(0);
              } catch (Throwable $e) {
                  fwrite(STDERR, $e->getMessage()."\n");
                  exit(1);
              }'; then
              echo "Firebird is ready (attempt $i)."
              exit 0
            fi
            echo "Waiting for Firebird... ($i/30)"
            sleep 2
          done
          echo "::error::Firebird did not become ready in time"
          exit 1

      - name: Run tests
        run: vendor/bin/phpunit
